<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><link rel="stylesheet" href="style.css"></head>
<body><div style="max-width:420px;margin:0 auto;padding:64px 24px">
<div style="display:flex;align-items:center;margin-bottom:28px"><b style="font-size:17px;flex:1">ISP Management</b><button class="btn" id="th" style="min-height:34px"></button></div>
<h1 style="margin:0 0 8px;font-size:30px">Welcome back</h1><p style="margin:0 0 24px;color:var(--mut)">Sign in with the username your Super Admin gave you.</p>
<div id="msg" role="alert" hidden style="padding:12px 16px;margin-bottom:18px;border-radius:10px;font-size:13px;background:var(--badt);color:var(--bad)"></div>
<form id="f" novalidate><label for="lid" style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">Username</label>
<input id="lid" class="in" autocomplete="username" placeholder="name@shahgroup.com" inputmode="email" autocapitalize="none" style="margin-bottom:16px">
<label for="pw" style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">Password</label>
<input id="pw" class="in" type="password" autocomplete="current-password" style="margin-bottom:20px">
<button class="btn p" id="go" type="submit" style="width:100%;min-height:44px">Sign in</button></form>
<p style="margin-top:20px;font-size:12px;color:var(--mut)">Sessions end after 20 minutes without activity.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="shell.js"></script>
<script>(async function(){
var C=window.ISP,$=function(i){return document.getElementById(i)},sb=Shell.client();Shell.theme($('th'));
function show(t){var m=$('msg');m.hidden=false;m.textContent=t}
if(new URLSearchParams(location.search).get('timeout'))show('You were signed out after 20 minutes without activity. Please sign in again.');
var s=await sb.auth.getSession();if(s.data.session){location.replace('app.html');return}
$('f').onsubmit=async function(e){e.preventDefault();var id=$('lid').value.trim(),pw=$('pw').value;
if(!id||!pw){show('Enter your username and password.');return}
var b=$('go');b.disabled=true;b.textContent='Signing in...';
try{var r=await fetch(C.url+'/functions/v1/'+C.loginFn,{method:'POST',headers:{'Content-Type':'application/json',apikey:C.key},body:JSON.stringify({login_id:id,password:pw})});
var d=await r.json();
if(r.ok&&d.ok){var x=await sb.auth.setSession(d.session);if(!x.error){location.replace('app.html');return}show('Sign in failed. Try again.')}
else{show(d.error||'Sign in failed. Try again.');$('pw').value=''}
}catch(err){show('Could not reach the server. Check your internet and try again.')}
b.disabled=false;b.textContent='Sign in'};})();</script></body></html>
